[package]
name = "pluck"
version = "1.1.0"
edition = "2021"
description = "Pluck, made by Matte Black"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
