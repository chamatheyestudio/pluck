<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pluck</title>
<!-- The little note that shows when you copy a link. The Pluck window opens it at /popup?u=LINK.
     Nothing downloads from here: the link waits in the Copied list inside Pluck. Made by Matte Black. -->
<style>
:root{--bg:#070707;--fg:#D6D6D6;--muted:#7A7A7A;--acc:#C9B48A;--accfg:#0A0A0A;--line:rgba(255,255,255,.09);--card:#141414}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default;overflow:hidden}
#t{height:100%;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border:1px solid var(--line);position:relative}
.th{width:46px;height:46px;flex:none;border-radius:8px;background:var(--card) center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.th svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.th.pic svg{display:none}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.k{font-size:13px;font-weight:600;color:var(--fg)}
.k b{color:var(--acc);font-weight:600}
.s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;flex:none}
button:hover{border-color:var(--muted)}
.x{width:24px;padding:0;border:0;background:transparent;color:var(--muted);font-size:15px}
.x:hover{color:var(--fg)}
#bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:100%;transform-origin:left;opacity:.7}
</style>
</head>
<body>
<div id="t">
  <div class="th" id="th"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div class="mid"><div class="k" id="k">Added to Pluck</div><div class="s" id="s"></div></div>
  <button type="button" id="view">View</button>
  <button type="button" class="x" id="x" title="Close">×</button>
  <i id="bar"></i>
</div>
<script>
const $ = (s) => document.querySelector(s);
const link = new URLSearchParams(location.search).get("u") || "";
const native = (m) => { try { window.ipc && window.ipc.postMessage(m); } catch (e) {} };
const THEMES = {
  nocturne: ["#0B0D10", "#ECEFF3", "#C6F432", "#0B0D10"], arcade: ["#1A0B2E", "#F1E8FF", "#FF4FA3", "#12061F"], gazette: ["#F4EFE6", "#1B1A17", "#B8261B", "#FFFFFF"],
  abyss: ["#04202C", "#E6F6F5", "#2EC4B6", "#04202C"], abduction: ["#05060F", "#EEF0FF", "#8B7CFF", "#05060F"], matte: ["#070707", "#D6D6D6", "#C9B48A", "#0A0A0A"],
};
const thumb = (u) => (!u ? "" : u.startsWith("data:") ? u : "/api/thumb?u=" + encodeURIComponent(u));
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "link"; } };
native("size:80");

// Goes away by itself after a few seconds, unless the mouse is on it.
const LIFE = 3200;
let left = LIFE, last = performance.now(), hover = false;
document.addEventListener("mouseenter", () => { hover = true; });
document.addEventListener("mouseleave", () => { hover = false; });
(function tick(now) {
  if (!hover) left -= now - last;
  last = now;
  $("#bar").style.transform = `scaleX(${Math.max(0, left / LIFE)})`;
  if (left <= 0) { native("close"); return; }
  requestAnimationFrame(tick);
})(performance.now());

$("#x").onclick = () => native("close");
$("#view").onclick = () => native("open:");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") native("close"); });

function show(list) {
  const me = list.find((x) => x.url === link) || { url: link, site: host(link) };
  const n = list.length || 1;
  $("#k").innerHTML = n > 1 ? `Added to Pluck · <b>${n} waiting</b>` : "Added to Pluck";
  $("#s").textContent = me.title || `${me.site || host(link)} link`;
  if (me.thumb) { $("#th").classList.add("pic"); $("#th").style.backgroundImage = `url("${thumb(me.thumb)}")`; }
}

(async () => {
  try {
    const n = await (await fetch("/api/native")).json();
    const t = THEMES[n.theme] || THEMES.matte;
    const r = document.documentElement.style;
    r.setProperty("--bg", t[0]); r.setProperty("--fg", t[1]); r.setProperty("--acc", t[2]); r.setProperty("--accfg", t[3]);
    if (n.theme === "gazette") { r.setProperty("--line", "rgba(0,0,0,.12)"); r.setProperty("--card", "#EAE3D6"); r.setProperty("--muted", "#6E685E"); }
  } catch (e) {}
  // The title and picture usually arrive within a second, so look a couple of times.
  for (const wait of [0, 900, 1800]) {
    await new Promise((r) => setTimeout(r, wait));
    try { show((await (await fetch("/api/copied")).json()).links || []); } catch (e) {}
  }
})();
</script>
</body>
</html>
