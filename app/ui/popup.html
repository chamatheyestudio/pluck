<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pluck</title>
<!-- The copied links card. The Pluck window opens it at /popup?u=LINK each time a link is copied.
     It lists every link copied since it was last closed (the engine keeps that list), each with its
     own Save button, and stays until you close it. Made by Matte Black. -->
<style>
:root{--bg:#070707;--fg:#D6D6D6;--muted:#7A7A7A;--acc:#C9B48A;--accfg:#0A0A0A;--line:rgba(255,255,255,.08);--card:#111}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default;overflow:hidden}
#card{border:1px solid var(--line);display:flex;flex-direction:column;max-height:100vh}
.hd{display:flex;align-items:center;gap:8px;padding:11px 10px 11px 16px;font-size:11px;color:var(--muted);flex:none;min-height:50px}
.hd b{color:var(--fg);font-weight:700;font-size:13px;letter-spacing:-.01em}
.hd .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;flex:none}
.x:hover{background:var(--line);color:var(--fg)}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--line)}
.th{width:48px;height:48px;flex:none;border-radius:7px;background:var(--card) center/cover no-repeat;position:relative;overflow:hidden}
.th.load:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:sh 1.2s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pf{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt{font-size:13px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt.dim{color:var(--muted);font-weight:400}
.ok{color:#9FD39A}
.tt.err{color:#FF8A7A;font-weight:400;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act{display:flex;gap:6px;align-items:center;flex:none}
button.b{height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--muted)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
button.p:hover{filter:brightness(1.08)}
button.b:disabled{opacity:.45;cursor:default;filter:none}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.rm{opacity:0;transition:opacity .15s}
.row:hover .rm{opacity:1}
</style>
</head>
<body>
<div id="card">
  <div class="hd"><b>pluck</b><span class="n" id="count">Link copied</span><span id="all"></span><button class="x" id="x" type="button" title="Close">×</button></div>
  <div class="list" id="list"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const first = new URLSearchParams(location.search).get("u") || "";
const native = (m) => { try { window.ipc && window.ipc.postMessage(m); } catch (e) {} };
const THEMES = {
  nocturne: ["#0B0D10", "#ECEFF3", "#C6F432", "#0B0D10"], arcade: ["#1A0B2E", "#F1E8FF", "#FF4FA3", "#12061F"], gazette: ["#F4EFE6", "#1B1A17", "#B8261B", "#FFFFFF"],
  abyss: ["#04202C", "#E6F6F5", "#2EC4B6", "#04202C"], abduction: ["#05060F", "#EEF0FF", "#8B7CFF", "#05060F"], matte: ["#070707", "#D6D6D6", "#C9B48A", "#0A0A0A"],
};
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = async (p, b) => {
  const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json", "x-pluck": "1" }, body: JSON.stringify(b || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
};
const thumb = (u) => (!u ? "" : u.startsWith("data:") ? u : "/api/thumb?u=" + encodeURIComponent(u));

// Keep the window the same height as the card.
let lastH = 0;
function fit() { const h = Math.ceil($(".hd").offsetHeight + $("#list").scrollHeight + 2); if (h !== lastH) { lastH = h; native("size:" + h); } }
new ResizeObserver(fit).observe($("#list"));
function closeAll() { post("/api/copied", { clear: true }).catch(() => {}).finally(() => native("close")); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll(); });

function defMode(i) {
  const types = new Set(i.items.map((x) => x.type));
  if (i.engine === "spotify") return "mp3";
  if (i.engine === "ytdlp") return i.kind === "audio" || (i.kind === "gallery" && !types.has("video")) ? "mp3" : "video";
  if (i.kind === "gallery") return types.has("video") ? (types.has("photo") ? "all" : "videos") : "photos";
  if (i.kind === "photo") return "photos";
  if (i.kind === "audio") return "orig";
  return "videos";
}
function label(mode, i) {
  const n = i.items.length;
  if (mode === "mp3") return "MP3";
  if (mode === "all" || n > 1) return `Save ${n}`;
  return "Save";
}

// One row per copied link: looking, ready, saving, saved or a problem.
const rows = new Map();
function row(url, jobId) {
  let r = rows.get(url);
  if (r) return r;
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<div class="th load"></div><div class="mid"><div class="pf">${esc(host(url))}</div><div class="tt dim">Taking a look…</div></div><div class="act"><button class="b p" data-do="early" type="button">Save</button></div>`;
  r = { url, el, info: null, state: "look", want: null, job: jobId ? { id: jobId } : null };
  rows.set(url, r);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.do === "open") native("open:" + url);
    else if (b.dataset.do === "early") early(r, "save");
    else if (b.dataset.do === "show") post("/api/reveal", { path: r.job.files[0] || r.job.folder }).catch(() => {});
    else if (b.dataset.do === "rm") remove(r);
    else if (b.dataset.m) save(r, b.dataset.m);
  });
  look(r);
  return r;
}
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "Link"; } }
function setAct(r, html) { $(".act", r.el).innerHTML = html; }

// Tapped Save before Pluck finished reading: it saves the moment it's ready.
function early(r, want) {
  if (r.state !== "look" || r.want) return;
  r.want = want;
  $(".pf", r.el).textContent = "Saves as soon as it's ready";
  setAct(r, ""); header();
}
// Title and picture first (about a second), the full read follows.
async function quick(r) {
  try {
    const q = await (await fetch("/api/peek?u=" + encodeURIComponent(r.url))).json();
    if (r.state !== "look") return;
    if (q.thumb) { $(".th", r.el).classList.remove("load"); $(".th", r.el).style.backgroundImage = `url("${thumb(q.thumb)}")`; }
    if (q.title) { const t = $(".tt", r.el); t.classList.remove("dim"); t.textContent = q.title; }
  } catch (e) {}
}

async function look(r) {
  quick(r);
  const slow = setTimeout(() => { if (r.state === "look" && $(".tt", r.el).classList.contains("dim")) $(".tt", r.el).textContent = "Still looking. Almost there…"; }, 7000);
  try {
    const i = await post("/api/probe", { url: r.url });
    r.info = i; r.state = "ready";
    $(".th", r.el).classList.remove("load");
    if (i.thumb) $(".th", r.el).style.backgroundImage = `url("${thumb(i.thumb)}")`;
    $(".pf", r.el).textContent = `${i.platform.name}${i.platform.sub ? " " + i.platform.sub.toLowerCase() : ""}${i.author ? " · " + i.author : ""}`;
    $(".tt", r.el).classList.remove("dim"); $(".tt", r.el).textContent = i.title || "Ready to save";
    const m = defMode(i);
    const types = new Set(i.items.map((x) => x.type));
    const mp3 = i.engine !== "spotify" && m !== "mp3" && (types.has("video") || types.has("audio"));
    if (r.job) { save(r, null); return; }
    if (r.want) { save(r, defMode(i)); return; }
    setAct(r, `<button class="b p" data-m="${m}" type="button">${esc(label(m, i))}</button>${mp3 ? `<button class="b" data-m="mp3" type="button">MP3</button>` : ""}`);
  } catch (e) {
    r.state = "error";
    $(".th", r.el).classList.remove("load");
    $(".tt", r.el).className = "tt err"; $(".tt", r.el).textContent = e.message;
    setAct(r, `<button class="b" data-do="open" type="button">Open</button><button class="x rm" data-do="rm" type="button" title="Remove">×</button>`);
  } finally { clearTimeout(slow); header(); }
}

// mode null: carry on with a save that started before the card reopened.
async function save(r, mode) {
  if (r.state !== "ready") return;
  r.state = "saving";
  setAct(r, "");
  const mid = $(".mid", r.el);
  const bar = document.createElement("div"); bar.className = "bar"; bar.innerHTML = "<i></i>"; mid.appendChild(bar);
  header();
  try {
    if (mode) { $(".tt", r.el).classList.remove("dim"); r.job = await post("/api/download", { url: r.url, mode, quality: "best", select: [] }); post("/api/copied", { url: r.url, job: r.job.id }).catch(() => {}); }
  }
  catch (e) { bar.remove(); r.state = "error"; $(".tt", r.el).className = "tt err"; $(".tt", r.el).textContent = e.message; setAct(r, `<button class="b" data-do="open" type="button">Open</button>`); header(); return; }
  const poll = async () => {
    let j;
    try { j = (await (await fetch("/api/state")).json()).jobs.find((x) => x.id === r.job.id); } catch (e) { setTimeout(poll, 1000); return; }
    if (!j) { setTimeout(poll, 800); return; }
    $("i", bar).style.width = Math.max(4, j.pct || 0) + "%";
    if (j.status === "done") {
      r.job = j; r.state = "done"; bar.remove();
      $(".pf", r.el).textContent = `Saved${j.files.length > 1 ? ` ${j.files.length} files` : ""}`; $(".pf", r.el).classList.add("ok");
      setAct(r, `<button class="b" data-do="show" type="button">Show</button>`);
      header(); return;
    }
    if (j.status === "error" || j.status === "canceled") {
      bar.remove(); r.state = "error"; $(".tt", r.el).className = "tt err"; $(".tt", r.el).textContent = j.error || "Couldn't save this one.";
      setAct(r, `<button class="b" data-do="open" type="button">Open</button>`); header(); return;
    }
    $(".pf", r.el).textContent = j.status === "queued" ? "Waiting for the one before it" : `Saving · ${Math.round(j.pct || 0)}%${j.speed ? " · " + j.speed : ""}`;
    setTimeout(poll, 600);
  };
  poll();
}

function remove(r) {
  r.el.remove(); rows.delete(r.url);
  post("/api/copied", { remove: r.url }).catch(() => {});
  if (!rows.size) native("close"); else header();
}

function header() {
  const list = [...rows.values()];
  const n = list.length;
  const ready = list.filter((r) => r.state === "ready" || (r.state === "look" && !r.want)).length;
  const saving = list.filter((r) => r.state === "saving").length;
  $("#count").textContent = n <= 1 ? (list[0] && list[0].state === "done" ? "Saved" : "Link copied") : `${n} links copied${saving ? ` · saving ${saving}` : ""}`;
  $("#all").innerHTML = n > 1 && ready > 1 ? `<button class="b p" id="saveAll" type="button">Save all ${ready}</button>` : "";
}
$("#card").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "x") closeAll();
  if (b.id === "saveAll") for (const r of rows.values()) { if (r.state === "ready") save(r, defMode(r.info)); else if (r.state === "look") early(r, "save"); }
});

(async () => {
  try {
    const n = await (await fetch("/api/native")).json();
    const t = THEMES[n.theme] || THEMES.matte;
    const s = document.documentElement.style;
    s.setProperty("--bg", t[0]); s.setProperty("--fg", t[1]); s.setProperty("--acc", t[2]); s.setProperty("--accfg", t[3]);
    if (n.theme === "gazette") { s.setProperty("--line", "rgba(0,0,0,.12)"); s.setProperty("--card", "#EAE3D6"); s.setProperty("--muted", "#6E685E"); }
  } catch (e) {}
  let links = [];
  try { links = (await (await fetch("/api/copied")).json()).links || []; } catch (e) {}
  if (first && !links.some((x) => x.url === first)) links.unshift({ url: first });
  for (const x of links) $("#list").appendChild(row(x.url, x.job).el);
  header(); fit();
})();
</script>
</body>
</html>
