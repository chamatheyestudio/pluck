<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pluck</title>
<!-- The little card that pops up when you copy a link. The Pluck window opens it at /popup?u=LINK. Made by Matte Black. -->
<style>
:root{--bg:#070707;--fg:#D6D6D6;--muted:#7A7A7A;--acc:#C9B48A;--accfg:#0A0A0A;--line:rgba(255,255,255,.08);--card:#0E0E0E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default;overflow:hidden}
.card{display:flex;gap:12px;padding:12px 12px 12px 12px;border:1px solid var(--line);min-height:100vh}
.th{width:72px;height:72px;flex:none;border-radius:8px;background:var(--card) center/cover no-repeat;position:relative;overflow:hidden}
.th.load:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sh 1.2s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.top b{color:var(--fg);font-weight:700;letter-spacing:-.01em;font-size:12px}
.top .pf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.x{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;flex:none}
.x:hover{background:var(--line);color:var(--fg)}
.tt{font-size:13px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tt.err{color:#FF8A7A;font-weight:400}
.btns{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
button.b{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--muted)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
button.p:hover{filter:brightness(1.08);border-color:var(--acc)}
button.l{border:0;background:transparent;color:var(--muted);padding:0 6px;font-weight:500}
button.l:hover{color:var(--fg)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.sub{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="th load" id="th"></div>
  <div class="mid">
    <div class="top"><b>pluck</b><span class="pf" id="pf">Link copied</span><button class="x" id="x" type="button" title="Close">×</button></div>
    <div class="tt" id="tt">Taking a look at it…</div>
    <div id="act"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const link = new URLSearchParams(location.search).get("u") || "";
const native = (m) => { try { window.ipc && window.ipc.postMessage(m); } catch (e) {} };
const close = () => native("close");
const THEMES = {
  nocturne: ["#0B0D10", "#ECEFF3", "#C6F432", "#0B0D10"], arcade: ["#1A0B2E", "#F1E8FF", "#FF4FA3", "#12061F"], gazette: ["#F4EFE6", "#1B1A17", "#B8261B", "#FFFFFF"],
  abyss: ["#04202C", "#E6F6F5", "#2EC4B6", "#04202C"], abduction: ["#05060F", "#EEF0FF", "#8B7CFF", "#05060F"], matte: ["#070707", "#D6D6D6", "#C9B48A", "#0A0A0A"],
};
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = async (p, b) => {
  const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json", "x-pluck": "1" }, body: JSON.stringify(b || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
};
function fit() { native("size:" + Math.ceil($("#card").getBoundingClientRect().height)); }

// Close by itself after a while, unless the mouse is on it.
let timer = 0, hover = false;
function later(ms) { clearTimeout(timer); timer = setTimeout(() => { if (!hover) close(); else later(2500); }, ms); }
document.addEventListener("mouseenter", () => { hover = true; });
document.addEventListener("mouseleave", () => { hover = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

function defMode(i) {
  const types = new Set(i.items.map((x) => x.type));
  if (i.engine === "spotify") return "mp3";
  if (i.engine === "ytdlp") return i.kind === "audio" || (i.kind === "gallery" && !types.has("video")) ? "mp3" : "video";
  if (i.kind === "gallery") return types.has("video") ? (types.has("photo") ? "all" : "videos") : "photos";
  if (i.kind === "photo") return "photos";
  if (i.kind === "audio") return "orig";
  return "videos";
}
function label(mode, i) {
  const n = i.items.length;
  if (mode === "mp3") return "Save MP3";
  if (mode === "photos") return n > 1 ? `Save ${n} photos` : "Save photo";
  if (mode === "all") return `Save all ${n}`;
  if (mode === "orig") return "Save";
  return n > 1 ? `Save ${n} videos` : "Save video";
}

let info = null;
function showReady() {
  const m = defMode(info);
  const types = new Set(info.items.map((x) => x.type));
  const mp3 = info.engine !== "spotify" && m !== "mp3" && (types.has("video") || types.has("audio"));
  $("#act").innerHTML = `<div class="btns"><button class="b p" data-m="${m}" type="button">${esc(label(m, info))}</button>${mp3 ? `<button class="b" data-m="mp3" type="button">MP3</button>` : ""}<button class="b l" id="open" type="button">More options</button></div>`;
  fit(); later(9000);
}
function showError(msg) {
  $("#th").classList.remove("load");
  $("#tt").className = "tt err"; $("#tt").textContent = msg;
  $("#act").innerHTML = `<div class="btns"><button class="b" id="open" type="button">Open in Pluck</button></div>`;
  fit(); later(8000);
}

async function save(mode) {
  clearTimeout(timer);
  $("#act").innerHTML = `<div class="bar"><i id="fill"></i></div><div class="sub" id="st">Starting</div>`;
  fit();
  let job;
  try { job = await post("/api/download", { url: link, mode, quality: "best", select: [] }); }
  catch (e) { showError(e.message); return; }
  const poll = async () => {
    let j;
    try { j = (await (await fetch("/api/state")).json()).jobs.find((x) => x.id === job.id); } catch (e) { setTimeout(poll, 1000); return; }
    if (!j) { setTimeout(poll, 800); return; }
    $("#fill") && ($("#fill").style.width = Math.max(4, j.pct || 0) + "%");
    if (j.status === "done") {
      const n = j.files.length;
      $("#act").innerHTML = `<div class="btns"><span class="sub" style="flex:1">Saved${n > 1 ? ` ${n} files` : ""}</span><button class="b p" id="show" type="button">Show</button></div>`;
      $("#show").onclick = () => { post("/api/reveal", { path: j.files[0] || j.folder }).catch(() => {}); close(); };
      fit(); later(7000); return;
    }
    if (j.status === "error") { showError(j.error || "Couldn't save this one."); return; }
    if (j.status === "canceled") { close(); return; }
    $("#st").textContent = j.status === "queued" ? "Waiting for the one before it" : `${Math.round(j.pct || 0)}%${j.speed ? " · " + j.speed : ""}`;
    setTimeout(poll, 600);
  };
  poll();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "x") { close(); return; }
  if (b.id === "open") { native("open:" + link); return; }
  if (b.dataset.m) save(b.dataset.m);
});

(async () => {
  try {
    const n = await (await fetch("/api/native")).json();
    const t = THEMES[n.theme] || THEMES.matte;
    const r = document.documentElement.style;
    r.setProperty("--bg", t[0]); r.setProperty("--fg", t[1]); r.setProperty("--acc", t[2]); r.setProperty("--accfg", t[3]);
    if (n.theme === "gazette") { r.setProperty("--line", "rgba(0,0,0,.12)"); r.setProperty("--card", "#EAE3D6"); r.setProperty("--muted", "#6E685E"); }
  } catch (e) {}
  fit(); later(15000);
  try {
    info = await post("/api/probe", { url: link });
    $("#pf").textContent = `${info.platform.name}${info.platform.sub ? " " + info.platform.sub.toLowerCase() : ""}${info.author ? " · " + info.author : ""}`;
    $("#tt").textContent = info.title || "Ready to save";
    $("#th").classList.remove("load");
    if (info.thumb) $("#th").style.backgroundImage = `url("${info.thumb.startsWith("data:") ? info.thumb : "/api/thumb?u=" + encodeURIComponent(info.thumb)}")`;
    showReady();
  } catch (e) { showError(e.message); }
})();
</script>
</body>
</html>
