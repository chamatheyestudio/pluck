# Builds and tests Pluck for Mac and Windows on every push. When main has a version in app/version.json
# that has no release yet, it publishes one (tag v<version>). Installed copies of Pluck read latest.json
# from the newest release and update themselves.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      shots:
        description: Print small window screenshots into the test logs
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check app/server.ts shell/launch.ts
      - name: Version and release check
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c 'import json; print(json.load(open("app/version.json"))["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match app/version.json ($v)"; exit 1
          fi
          release=false
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            if gh release view "v$v" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "v$v is already released"; else release=true; echo "v$v will be released"; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          export PLUCK_ROOT="$RUNNER_TEMP/pluck" PLUCK_BUNDLED="$PWD/app" PLUCK_NO_WINDOW=1 PLUCK_NO_EXIT=1 PLUCK_FEED=""
          deno run -A --no-prompt --no-config shell/launch.ts > "$RUNNER_TEMP/run.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47821/api/state > state.json && break; sleep 1; done
          python3 -c 'import json; d=json.load(open("state.json")); v=json.load(open("app/version.json")); assert d["version"] == v["version"] and d["shell"] == v["shell"], d; print("Pluck", d["version"], "is up, launcher", d["shell"])'
          cat "$PLUCK_ROOT/pluck.log"

  native-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Pluck window (Pluck.exe)
        run: cargo build --release --locked --manifest-path shell/native/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: shell/native/target/release/pluck.exe
          if-no-files-found: error

  windows:
    needs: [check, native-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build Pluck-Setup.exe
        run: PLUCK_APP_EXE=native/pluck.exe installer/windows/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Pluck-Setup.exe
          if-no-files-found: error

  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pluck.dmg
        run: installer/mac/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Pluck.dmg
          if-no-files-found: error

  test-mac:
    needs: mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - name: Install from the disk image
        run: |
          hdiutil attach dist/Pluck.dmg -nobrowse -mountpoint /tmp/pluckdmg
          ls -la /tmp/pluckdmg
          cp -R /tmp/pluckdmg/Pluck.app /Applications/
          hdiutil detach /tmp/pluckdmg
          codesign --verify --verbose=2 /Applications/Pluck.app
      - name: Start Pluck and download
        run: |
          export PLUCK_NO_WINDOW=1 PLUCK_NO_EXIT=1 PLUCK_FEED=http://127.0.0.1:8765/upd/latest.json
          /Applications/Pluck.app/Contents/MacOS/Pluck --smoke
          scripts/e2e.sh "$HOME/Library/Application Support/Pluck"
      - name: Open the Pluck window
        run: |
          open -a /Applications/Pluck.app
          sleep 15
          screencapture -x mac-window.png || true
          if [ "${{ inputs.shots }}" = "true" ]; then sips -Z 1100 -s format jpeg -s formatOptions 55 mac-window.png --out mac-small.jpg >/dev/null && echo "SHOT-BEGIN" && base64 -b 100 -i mac-small.jpg && echo "SHOT-END"; fi
          pgrep -lf "Pluck.app/Contents/MacOS/Pluck"
          curl -s http://127.0.0.1:47821/api/state | python3 -c 'import json,sys; n=json.load(sys.stdin)["windows"]; print("windows showing Pluck:", n); sys.exit(0 if n >= 1 else 1)'
      - name: Copy a link and check the card pops up
        run: |
          osascript -e 'tell application "Finder" to activate' || true
          sleep 2
          printf 'Look at this https://www.youtube.com/watch?v=jNQXAC9IVRw' | pbcopy
          sleep 12
          screencapture -x mac-card.png || true
          if [ "${{ inputs.shots }}" = "true" ]; then sips -Z 1100 -s format jpeg -s formatOptions 55 mac-card.png --out mac-card.jpg >/dev/null && echo "SHOT-BEGIN" && base64 -b 100 -i mac-card.jpg && echo "SHOT-END"; fi
          curl -s http://127.0.0.1:47821/api/state | python3 -c 'import json,sys; d=json.load(sys.stdin); print("links checked:", d["clipAsks"], "cards shown:", d["popups"], "window checked in", d["nativeAgo"], "s ago"); sys.exit(0 if d["popups"] >= 1 else 1)'
          osascript -e 'tell application "System Events" to tell process "Pluck" to get name of every window' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-window
          path: mac-*.png
          if-no-files-found: ignore

  test-windows:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Install silently
        run: |
          ./dist/Pluck-Setup.exe //S
          ls -la "$LOCALAPPDATA/Pluck" "$LOCALAPPDATA/Pluck/bin"
      - name: Start Pluck and download
        run: |
          export PLUCK_NO_WINDOW=1 PLUCK_NO_EXIT=1 PLUCK_FEED=http://127.0.0.1:8765/upd/latest.json
          "$LOCALAPPDATA/Pluck/Pluck.exe" --smoke
          scripts/e2e.sh "$(cygpath -u "$LOCALAPPDATA")/Pluck"
      - name: Open the Pluck window
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\Pluck\Pluck.exe"
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\win-window.png")
          if ("${{ inputs.shots }}" -eq "true") {
            $w = 1100; $h = [int]($b.Height * $w / $b.Width)
            $small = New-Object System.Drawing.Bitmap $bmp, $w, $h
            $enc = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
            $ps = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ps.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 55L
            $small.Save("$PWD\win-small.jpg", $enc, $ps)
            "SHOT-BEGIN"
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\win-small.jpg"))
            for ($i = 0; $i -lt $b64.Length; $i += 100) { $b64.Substring($i, [Math]::Min(100, $b64.Length - $i)) }
            "SHOT-END"
          }
          Get-Process pluck -ErrorAction Stop | Format-Table Id, ProcessName, MainWindowTitle
          $n = (Invoke-RestMethod http://127.0.0.1:47821/api/state).windows
          "windows showing Pluck: $n"
          if ($n -lt 1) { exit 1 }
      - name: Copy a link and check the card pops up
        shell: pwsh
        run: |
          Start-Process notepad
          Start-Sleep -Seconds 3
          Set-Clipboard -Value "Look at this https://www.youtube.com/watch?v=jNQXAC9IVRw"
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\win-card.png")
          if ("${{ inputs.shots }}" -eq "true") {
            $w = 1100; $h = [int]($b.Height * $w / $b.Width)
            $small = New-Object System.Drawing.Bitmap $bmp, $w, $h
            $enc = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
            $ps = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ps.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 55L
            $small.Save("$PWD\win-card.jpg", $enc, $ps)
            "SHOT-BEGIN"
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\win-card.jpg"))
            for ($i = 0; $i -lt $b64.Length; $i += 100) { $b64.Substring($i, [Math]::Min(100, $b64.Length - $i)) }
            "SHOT-END"
          }
          $d = Invoke-RestMethod http://127.0.0.1:47821/api/state
          "links checked: $($d.clipAsks) cards shown: $($d.popups) window checked in $($d.nativeAgo)s ago"
          if ($d.popups -lt 1) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-window
          path: win-*.png
          if-no-files-found: ignore
      - name: Uninstall
        run: |
          "$LOCALAPPDATA/Pluck/Uninstall Pluck.exe" //S
          sleep 8
          if [ -d "$LOCALAPPDATA/Pluck" ]; then echo "::error::uninstall left files behind"; ls -la "$LOCALAPPDATA/Pluck"; exit 1; fi
          echo "Uninstalled cleanly"

  release:
    if: needs.check.outputs.release == 'true'
    needs: [check, windows, mac, test-mac, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build the update feed
        run: scripts/build-feed.sh dist "https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.version }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py > notes.md
          gh release create "v${{ needs.check.outputs.version }}" dist/Pluck.dmg dist/Pluck-Setup.exe dist/app.zip dist/latest.json \
            --target "$GITHUB_SHA" --title "Pluck ${{ needs.check.outputs.version }}" --notes-file notes.md --latest
